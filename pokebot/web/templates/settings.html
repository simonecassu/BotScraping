{% extends "base.html" %}
{% block title %}Impostazioni · PokéBot 30th{% endblock %}
{% block content %}
<h1>Impostazioni</h1>
<form method="post" class="settings">
  <fieldset>
    <legend>Ricerca</legend>
    <label>Ogni quanti minuti cercare <input type="number" name="interval_minutes" min="1" value="{{ s.interval_minutes }}"></label>
    <label>Prezzo massimo (€, 0 = nessun limite) <input type="number" step="0.5" min="0" name="max_price" value="{{ s.max_price }}"></label>
    <label>Lotti: quota minima di carte mancanti (%) <input type="number" name="lot_min_percent" min="0" max="100" value="{{ (s.lot_min_ratio * 100)|round|int }}"></label>
    <label class="chk"><input type="checkbox" name="only_italy" {{ 'checked' if s.only_italy }}> Solo venditori in Italia (eBay)</label>
    <label class="chk"><input type="checkbox" name="notify_unverifiable_lots" {{ 'checked' if s.notify_unverifiable_lots }}> Notifica anche i lotti del set in cui non si capisce quali carte ci sono</label>
  </fieldset>
  <fieldset>
    <legend>Marketplace</legend>
    <label class="chk"><input type="checkbox" name="sources" value="subito" {{ 'checked' if 'subito' in s.sources }}> Subito.it</label>
    <label class="chk"><input type="checkbox" name="sources" value="vinted" {{ 'checked' if 'vinted' in s.sources }}> Vinted</label>
    <label class="chk"><input type="checkbox" name="sources" value="ebay" {{ 'checked' if 'ebay' in s.sources }}> eBay.it {% if ebay_api %}<small>(API ufficiale)</small>{% else %}<small>(scraping pagina; per l'API imposta EBAY_CLIENT_ID/SECRET)</small>{% endif %}</label>
  </fieldset>
  <fieldset>
    <legend>Query</legend>
    <label>Ricerche generiche (una per riga)<textarea name="generic_queries" rows="6">{{ s.generic_queries|join('\n') }}</textarea></label>
    <label class="chk"><input type="checkbox" name="per_card_queries" {{ 'checked' if s.per_card_queries }}> Cerca anche ogni carta mancante singolarmente (es. «Lapras 131/128»)</label>
    <label>Quante carte singole per ciclo (a rotazione) <input type="number" name="per_card_batch" min="0" value="{{ s.per_card_batch }}"></label>
    <label>Parole che identificano il set negli annunci (una per riga)<textarea name="set_keywords" rows="6">{{ s.set_keywords|join('\n') }}</textarea></label>
  </fieldset>
  <button class="btn primary" type="submit">Salva</button>
</form>

<h2>Telegram</h2>
<p>Stato: <b>{{ 'configurato' if telegram_ok else 'NON configurato' }}</b>. Token e chat id si impostano nel file <code>.env</code> (vedi README).</p>
<form method="post" action="{{ url_for('test_telegram') }}"><button class="btn">📨 Invia messaggio di prova</button></form>
{% endblock %}
