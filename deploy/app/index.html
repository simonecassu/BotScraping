<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokéBot 30th</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');
:root{
  --red:#e3350d;--red2:#b5240a;--yel:#ffcb05;--yel2:#c7a008;--blue:#2a75bb;--navy:#0f1f3d;--navy2:#162a52;
  --bg:#0b1630;--sec:#152648;--card:#1b3160;--txt:#f4f6fb;--hint:#9fb0d0;--line:rgba(255,255,255,.1);
  --ok:#4cd964;--warn:#ffa41b;--bad:#ff5a5f;--link:#7fc4ff;--btn:var(--red);--btnt:#fff;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 "Nunito",-apple-system,system-ui,sans-serif}
body{background:
  radial-gradient(circle at 85% -10%, rgba(255,203,5,.18), transparent 38%),
  radial-gradient(circle at -10% 110%, rgba(227,53,13,.22), transparent 42%), var(--bg)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--red) 0,var(--red) 52%,#111 52%,#111 56%,var(--navy) 56%);padding:10px 12px 0;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);padding-bottom:12px}
.title .ball{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#fff 0,#fff 46%,#111 46%,#111 54%,#e3350d 54%);position:relative;flex:none;border:3px solid #111}
.title .ball::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border:3px solid #111;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.title small{color:#ffe9a8;font-weight:700;font-size:12px;margin-left:auto}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px}
nav button{flex:1;padding:8px 6px;border:2px solid transparent;border-radius:999px;background:rgba(255,255,255,.08);color:#dbe4f5;font:800 13px "Nunito",sans-serif;white-space:nowrap}
nav button.on{background:var(--yel);color:#1a1a1a;border-color:#fff3b0;box-shadow:0 3px 0 var(--yel2)}
main{padding:12px;padding-bottom:40px}.hidden{display:none}
.card-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=search],select,input[type=number]{padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--sec);color:var(--txt);font:700 15px "Nunito",sans-serif}
input[type=search]{flex:1;min-width:150px}
.pill{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--sec);color:var(--hint);border:2px solid transparent}.pill.on{color:#1a1a1a;background:var(--yel);border-color:#fff3b0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.c{position:relative;background:var(--card);border-radius:12px;padding:6px;border:3px solid #0a1328;box-shadow:0 3px 0 #0a1328}
.c.miss{border-color:var(--yel);box-shadow:0 3px 0 var(--yel2),0 0 14px rgba(255,203,5,.35)}
.c img{width:100%;aspect-ratio:245/342;object-fit:cover;border-radius:7px;background:#0008;display:block}
.c:not(.miss) img{filter:grayscale(.85) brightness(.55)}
.c:not(.miss)::before{content:"✓";position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#06320f;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:1}
.c .n{font-size:11px;color:var(--hint);margin-top:5px;font-weight:700}.c .nm{font-size:12px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c .tag{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:10px;font-weight:900;padding:2px 7px;border-radius:7px;letter-spacing:.3px;z-index:1}
.c.pending{opacity:.55}
h2{font-size:18px;font-weight:900;margin:16px 0 8px;color:var(--yel)}h3{font-size:13px;color:var(--hint);margin:12px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.folder{background:var(--sec);border-radius:14px;padding:10px 12px;margin-bottom:9px;border:2px solid var(--line)}
.folder .hd{display:flex;align-items:center;gap:10px}.folder .hd img{width:36px;height:50px;object-fit:cover;border-radius:5px;border:2px solid var(--yel)}
.folder .hd b{flex:1;font-weight:900}.folder .hd .cnt{color:var(--hint);font-size:13px;font-weight:800}
.lst{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.lst img,.lst .ph{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#0006;flex:none;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px;border:2px solid var(--line)}
.lst .t{flex:1;min-width:0}.lst .t .ti{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lst .t .mt{font-size:12px;color:var(--hint);margin-top:3px;font-weight:700}.lst .pr{font-weight:900;white-space:nowrap;color:var(--yel)}.lst .deal{color:var(--warn)}
.bar{height:16px;border-radius:8px;background:#0a1328;overflow:hidden;border:2px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yel))}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.kpi div{background:var(--sec);border-radius:14px;padding:12px;border:2px solid var(--line)}.kpi b{display:block;font-size:22px;font-weight:900;color:var(--yel)}.kpi span{font-size:12px;color:var(--hint);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--hint);font-weight:800}td.r,th.r{text-align:right}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.set label{flex:1;font-weight:800}.set small{display:block;color:var(--hint);font-size:12px;font-weight:700}
.sw{width:52px;height:30px;border-radius:15px;background:#0a1328;position:relative;border:2px solid var(--line);flex:none}.sw.on{background:var(--red);border-color:#ff8a70}.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}.sw.on::after{left:24px}
.btn{padding:10px 16px;border-radius:999px;border:0;background:var(--red);color:#fff;font:900 14px "Nunito",sans-serif;box-shadow:0 3px 0 var(--red2)}.btn.sec{background:var(--yel);color:#1a1a1a;box-shadow:0 3px 0 var(--yel2)}
.toast{position:fixed;left:12px;right:12px;bottom:14px;background:#111c;color:#fff;padding:11px 14px;border-radius:14px;font-size:14px;font-weight:800;backdrop-filter:blur(8px);z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;border:2px solid var(--yel)}.toast.show{opacity:1}
.hint{color:var(--hint);font-size:13px;font-weight:700}.err{color:var(--bad)}
a{color:var(--link);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="title"><span class="ball"></span>PokéBot 30th <small id="upd">…</small></div>
  <nav>
    <button data-tab="check" class="on">Checklist</button>
    <button data-tab="found">Trovati</button>
    <button data-tab="prices">Prezzi</button>
    <button data-tab="settings">Impostazioni</button>
  </nav>
</header>
<main>
  <section id="tab-check">
    <div class="card-row">
      <input id="q" type="search" placeholder="Cerca nome o numero…">
      <select id="rar"><option value="">Tutte le rarità</option></select>
    </div>
    <div class="card-row" id="setpills"></div>
    <p class="hint">Tocca una carta per segnarla <b>mancante</b> (bordo giallo) o <b>presa</b>. Ogni tocco diventa un comando per il bot.</p>
    <div id="grid" class="grid"></div>
  </section>

  <section id="tab-found" class="hidden">
    <div class="card-row"><input id="qf" type="search" placeholder="Filtra per carta…"><span class="pill" id="fcount"></span></div>
    <div id="folders"></div>
  </section>

  <section id="tab-prices" class="hidden">
    <div id="progress"></div>
    <h2>Quanto manca</h2>
    <div id="cost"></div>
    <h2>Prezzi per carta</h2>
    <p class="hint">Minimo, mediana e massimo degli annunci visti. Tocca una riga per aprire la cartella.</p>
    <table id="ptable"><thead><tr><th>Carta</th><th class="r">Min</th><th class="r">Mediana</th><th class="r">Max</th><th class="r">N</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="tab-settings" class="hidden">
    <div id="settings"></div>
    <h2>Azioni</h2>
    <div class="card-row">
      <button class="btn" data-cmd="/cerca">🔎 Cerca ora</button>
      <button class="btn sec" data-cmd="/esporta">📎 Excel</button>
      <button class="btn sec" data-cmd="/stato">ℹ️ Stato</button>
    </div>
    <p class="hint" id="lastrun"></p>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (v) => v == null ? "n.d." : v.toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const SRC = { ebay: "eBay.it", vinted: "Vinted", wallapop: "Wallapop" };
let state = null, cards = [], byId = {}, wanted = new Set(), pending = new Set(), filterSet = "";

function toast(msg, ms = 2200) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
function openLink(u) { if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank"); }

async function sendCmd(text) {
  if (!tg || !tg.initData) { toast("Apri la pagina da Telegram per inviare comandi"); return false; }
  try {
    const r = await fetch("/api/cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData, text }) });
    const d = await r.json();
    if (!d.ok) { toast("Errore: " + (d.error || d.status)); return false; }
    return true;
  } catch (e) { toast("Rete non disponibile"); return false; }
}

async function load() {
  try {
    const r = await fetch("/api/state?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
  } catch (e) {
    $("#upd").textContent = "stato non disponibile";
    $("#grid").innerHTML = '<p class="err">Il bot non ha ancora pubblicato lo stato. Riprova tra un minuto.</p>';
    return;
  }
  cards = state.sets.flatMap((s) => s.cards.map((c) => ({ ...c, set: s.id, setName: s.name, printed: s.printed_total })));
  byId = Object.fromEntries(cards.map((c) => [c.id, c]));
  wanted = new Set(state.wanted);
  const d = new Date(state.generated_at * 1000);
  $("#upd").textContent = "aggiornato " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  renderAll();
}

function renderAll() { renderChecklist(); renderFound(); renderPrices(); renderSettings(); }

/* ---------- Checklist ---------- */
function renderChecklist() {
  const rar = $("#rar");
  if (rar.options.length <= 1) [...new Set(cards.map((c) => c.rarity))].sort().forEach((r) => rar.insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`));
  const pills = $("#setpills");
  pills.innerHTML = state.sets.map((s) => {
    const miss = s.cards.filter((c) => wanted.has(c.id)).length;
    return `<span class="pill ${filterSet === s.id ? "on" : ""}" data-set="${s.id}">${esc(s.name)} · ${miss}/${s.cards.length} mancanti</span>`;
  }).join("") + `<span class="pill">Mancanti <b>${wanted.size}</b>/${cards.length}</span>`;
  pills.querySelectorAll("[data-set]").forEach((p) => p.onclick = () => { filterSet = filterSet === p.dataset.set ? "" : p.dataset.set; renderChecklist(); });
  const q = $("#q").value.trim().toLowerCase(), rv = rar.value;
  const list = cards.filter((c) => (!filterSet || c.set === filterSet) && (!rv || c.rarity === rv) &&
    (!q || c.name.toLowerCase().includes(q) || c.number.toLowerCase().includes(q) || c.code.includes(q)));
  $("#grid").innerHTML = list.map((c) => `
    <div class="c ${wanted.has(c.id) ? "miss" : ""} ${pending.has(c.id) ? "pending" : ""}" data-id="${c.id}">
      ${wanted.has(c.id) ? '<span class="tag">MANCA</span>' : ""}
      <img loading="lazy" src="${esc(c.image)}" alt="">
      <div class="n">${c.printed ? "#" + esc(c.number) + "/" + c.printed : esc(c.code) + " · #" + esc(c.number)}</div>
      <div class="nm">${esc(c.name)}</div>
    </div>`).join("");
  $("#grid").querySelectorAll(".c").forEach((el) => el.onclick = () => toggle(el.dataset.id));
}
async function toggle(id) {
  const c = byId[id]; const willWant = !wanted.has(id);
  pending.add(id); renderChecklist();
  const ok = await sendCmd((willWant ? "/aggiungi " : "/rimuovi ") + c.code);
  pending.delete(id);
  if (ok) { willWant ? wanted.add(id) : wanted.delete(id); toast((willWant ? "Segnata mancante: " : "Segnata presa: ") + c.name); }
  renderChecklist();
}
$("#q").oninput = renderChecklist; $("#rar").onchange = renderChecklist;

/* ---------- Trovati ---------- */
function renderFound() {
  const q = $("#qf").value.trim().toLowerCase();
  const groups = {};
  let lots = [];
  for (const f of state.found) {
    if (f.kind === "lot") { lots.push(f); continue; }
    for (const id of (f.sure.length ? f.sure : f.cards)) (groups[id] ||= []).push(f);
  }
  const ids = Object.keys(groups).filter((id) => byId[id]).sort((a, b) => cards.indexOf(byId[a]) - cards.indexOf(byId[b]))
    .filter((id) => !q || byId[id].name.toLowerCase().includes(q) || byId[id].number.includes(q));
  $("#fcount").textContent = state.found.length + " annunci";
  const folder = (title, img, items, key) => {
    const bySrc = {};
    items.forEach((f) => (bySrc[f.source] ||= []).push(f));
    const body = ["ebay", "vinted", "wallapop"].filter((s) => bySrc[s]).map((s) => `<h3>${SRC[s]} (${bySrc[s].length})</h3>` +
      bySrc[s].sort((a, b) => (a.price_num ?? 1e9) - (b.price_num ?? 1e9)).slice(0, 25).map((f) => `
        <div class="lst" data-url="${esc(f.url)}">
          ${f.image ? `<img loading="lazy" src="${esc(f.image)}" alt="">` : '<div class="ph">foto n.d.</div>'}
          <div class="t"><div class="ti">${f.deal ? "🔥 " : ""}${esc(f.title)}</div>
            <div class="mt">${new Date(f.ts * 1000).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" })}${f.location ? " · " + esc(f.location) : ""}${f.kind === "lot" ? " · 📦 lotto" : ""}${f.notified ? "" : " · non inviato"}</div></div>
          <div class="pr ${f.deal ? "deal" : ""}">${esc(f.price || "n.d.")}</div>
        </div>`).join("")).join("");
    return `<div class="folder" data-key="${key}"><div class="hd">${img ? `<img src="${esc(img)}" alt="">` : ""}<b>${esc(title)}</b><span class="cnt">${items.length} ›</span></div><div class="bd hidden">${body}</div></div>`;
  };
  let html = ids.map((id) => { const c = byId[id]; return folder(c.printed ? `${c.name} ${c.number}/${c.printed}` : `${c.name} (Classic)`, c.image, groups[id], id); }).join("");
  if (lots.length && !q) html += folder("📦 Lotti con carte mancanti", "", lots, "lot");
  $("#folders").innerHTML = html || '<p class="hint">Nessun annuncio trovato finora.</p>';
  $("#folders").querySelectorAll(".folder .hd").forEach((hd) => hd.onclick = () => hd.nextElementSibling.classList.toggle("hidden"));
  $("#folders").querySelectorAll(".lst").forEach((el) => el.onclick = () => openLink(el.dataset.url));
}
$("#qf").oninput = renderFound;
function openFolder(id) { showTab("found"); $("#qf").value = ""; renderFound(); const f = $(`.folder[data-key="${id}"]`); if (f) { f.querySelector(".bd").classList.remove("hidden"); f.scrollIntoView({ behavior: "smooth" }); } }

/* ---------- Prezzi / progresso ---------- */
function renderPrices() {
  const c = state.completion, p = state.prices;
  $("#progress").innerHTML = `
    <h2>Progresso set</h2>
    <div class="bar"><i style="width:${c.percent.toFixed(0)}%"></i></div>
    <div class="kpi">
      <div><b>${c.owned}/${c.total}</b><span>carte possedute (${c.percent.toFixed(0)}%)</span></div>
      <div><b>${c.missing}</b><span>mancanti</span></div>
    </div>
    ${Object.entries(c.by_rarity).filter(([, v]) => v[0] > 0).map(([k, v]) => `<div class="set"><label>${esc(k)}</label><span>${v[0]}/${v[1]}</span></div>`).join("")}`;
  $("#cost").innerHTML = c.missing ? `<div class="kpi">
      <div><b>${eur(c.cost_min)}</b><span>ai prezzi minimi visti</span></div>
      <div><b>${eur(c.cost_median)}</b><span>ai prezzi mediani</span></div></div>
    <p class="hint">Stima su ${c.priced} carte con prezzi visti${c.missing - c.priced ? `, ${c.missing - c.priced} ancora senza prezzo` : ""}.</p>` : "<p>🎉 Set completo!</p>";
  const rows = cards.filter((k) => p[k.id]).sort((a, b) => (wanted.has(b.id) - wanted.has(a.id)) || (p[b.id].min - p[a.id].min));
  $("#ptable tbody").innerHTML = rows.map((k) => { const s = p[k.id]; const tr = s.recent_median != null && s.older_median ? (s.recent_median > s.older_median * 1.05 ? " 📈" : s.recent_median < s.older_median * 0.95 ? " 📉" : "") : "";
    return `<tr data-id="${k.id}"><td>${wanted.has(k.id) ? "⭐ " : ""}${esc(k.name)} <span class="hint">${k.printed ? k.number + "/" + k.printed : "Classic"}</span>${tr}</td><td class="r">${eur(s.min)}</td><td class="r">${eur(s.median)}</td><td class="r">${eur(s.max)}</td><td class="r">${s.n}</td></tr>`; }).join("")
    || '<tr><td colspan="5" class="hint">Nessun prezzo ancora.</td></tr>';
  $("#ptable tbody").querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => openFolder(tr.dataset.id));
}

/* ---------- Impostazioni ---------- */
function renderSettings() {
  const s = state.settings;
  const row = (label, hint, control) => `<div class="set"><label>${label}<small>${hint}</small></label>${control}</div>`;
  const num = (key, val, cmd, step = 1, min = 0) => `<input type="number" step="${step}" min="${min}" value="${val ?? ""}" data-cmd="${cmd}" style="width:90px">`;
  const sw = (on, cmdOn, cmdOff) => `<button class="sw ${on ? "on" : ""}" data-on="${cmdOn}" data-off="${cmdOff}" aria-pressed="${on}"></button>`;
  const srcs = ["wallapop", "vinted", "ebay"];
  $("#settings").innerHTML = `
    ${row("Pausa notifiche", "il bot cerca e accumula, invia tutto alla ripresa", sw(s.paused, "/pausa", "/riprendi"))}
    ${row("Avviso affare 🔥", "sotto questa % della mediana storica (0 = spento)", num("deal_pct", s.deal_pct, "/affari {v}"))}
    ${row("Annunci per carta", "i più economici inviati per ogni giro", num("max", s.max_per_card, "/max {v}", 1, 1))}
    ${row("Prezzo massimo €", "0 = nessun limite", num("prezzo", s.max_price, "/prezzo {v}", 0.5))}
    ${row("Soglia lotti %", "quota minima di carte mancanti in un lotto", num("soglia", Math.round((s.lot_min_ratio || 0) * 100), "/soglia {v}"))}
    ${row("Ricerca ogni (min)", "intervallo della ricerca automatica", num("intervallo", s.interval_minutes, "/intervallo {v}", 1, 5))}
    ${row("Solo carte italiane", "scarta annunci in francese, inglese e altre lingue", sw(s.language === "ita", "/lingua ita", "/lingua tutte"))}
    ${row("Immagini nei messaggi", "foto degli annunci e della carta", sw(s.images !== false, "/immagini on", "/immagini off"))}
    ${row("Ore silenziose", s.quiet_hours ? `dalle ${s.quiet_hours[0]} alle ${s.quiet_hours[1]}` : "nessuna",
      `<span><input type="number" min="0" max="23" value="${s.quiet_hours ? s.quiet_hours[0] : 23}" id="qh1" style="width:62px"> – <input type="number" min="0" max="23" value="${s.quiet_hours ? s.quiet_hours[1] : 8}" id="qh2" style="width:62px"> ${sw(!!s.quiet_hours, "/notte {qh}", "/notte off")}</span>`)}
    <h2>Fonti</h2>
    ${srcs.map((k) => row(SRC[k], "", sw((s.sources || []).includes(k), `/fonti ${[...new Set([...(s.sources || []), k])].join(" ")}`, `/fonti ${(s.sources || []).filter((x) => x !== k).join(" ") || "wallapop"}`))).join("")}`;
  $("#settings").querySelectorAll("input[type=number][data-cmd]").forEach((inp) => inp.onchange = async () => {
    const cmd = inp.dataset.cmd.replace("{v}", inp.value); if (await sendCmd(cmd)) toast("Inviato: " + cmd);
  });
  $("#settings").querySelectorAll(".sw").forEach((b) => b.onclick = async () => {
    const on = !b.classList.contains("on");
    let cmd = on ? b.dataset.on : b.dataset.off;
    cmd = cmd.replace("{qh}", `${$("#qh1").value} ${$("#qh2").value}`);
    if (await sendCmd(cmd)) { b.classList.toggle("on", on); toast("Inviato: " + cmd); }
  });
  const lr = state.last_run;
  $("#lastrun").innerHTML = lr ? `Ultimo giro ${new Date(lr.started_at * 1000).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}: ${lr.listings_seen} annunci letti, ${lr.matches} segnalati` +
    (lr.per_source && Object.keys(lr.per_source).length ? " · " + Object.entries(lr.per_source).map(([k, v]) => `${SRC[k] || k} ${v}`).join(", ") : "") +
    (lr.errors && Object.keys(lr.errors).length ? `<br><span class="err">⚠️ ${Object.entries(lr.errors).map(([k, v]) => esc(k + ": " + String(v).slice(0, 80))).join("<br>")}</span>` : "") : "";
  document.querySelectorAll("[data-cmd].btn").forEach((b) => b.onclick = async () => { if (await sendCmd(b.dataset.cmd)) toast("Inviato " + b.dataset.cmd + ": guarda la chat"); });
}

/* ---------- tabs ---------- */
function showTab(name) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  ["check", "found", "prices", "settings"].forEach((t) => $("#tab-" + t).classList.toggle("hidden", t !== name));
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
load();
setInterval(load, 90000);
</script>
</body>
</html>
