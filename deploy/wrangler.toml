# Configurazione del ponte Telegram → GitHub per Cloudflare Workers.
# Il deploy avviene dal workflow GitHub ".github/workflows/ponte.yml" (nessun editor da usare).
name = "pokebot-bridge"
main = "cloudflare-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# orologio del bot: ogni 20 minuti il ponte avvia la ricerca su GitHub (il cron di GitHub è inaffidabile)
[triggers]
crons = ["7,27,47 * * * *"]

[vars]
GITHUB_REPO = "simonecassu/BotScraping"

# Mini App Telegram: pagina statica servita dal worker su /app
[assets]
directory = "app"
binding = "ASSETS"
run_worker_first = true
