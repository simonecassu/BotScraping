# Il bot gira gratis su GitHub Actions, senza PC.
# - Lo sveglia il ponte Cloudflare (deploy/cloudflare-worker.js): subito a ogni messaggio Telegram e, ogni 5 minuti,
#   solo quando c'è qualcosa da fare (inseguimenti, ricerca completa ogni /intervallo minuti, post del canale).
#   Il cron qui sotto è solo una riserva oraria; "Run workflow" forza una ricerca immediata.
# - Lo stato (database e dati per la Mini App) è salvato cifrato nel branch "bot-state" (il repository è pubblico):
#   la chiave è ricavata da TELEGRAM_BOT_TOKEN, quindi cambiando token lo stato salvato non si legge più (vedi README).
name: Pescacarte

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [telegram, timer]

permissions:
  contents: write

concurrency:
  group: pokebot
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # coda comandi (branch bot-queue) e salvataggio dello stato (bot-state)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # Se il ripristino fallisce il job si ferma e lo stato salvato resta intatto (mai sovrascritto con uno vuoto).
      - name: Ripristina lo stato precedente
        id: restore
        run: |
          mkdir -p data
          rc=0; git ls-remote --exit-code --heads origin bot-state >/dev/null || rc=$?
          if [ "$rc" = 2 ]; then
            echo "primo avvio: nessuno stato precedente"
          elif [ "$rc" != 0 ]; then
            echo "::error::GitHub non risponde: riprovo al prossimo giro"; exit 1
          else
            git fetch --depth=1 origin bot-state
            if git cat-file -e origin/bot-state:pokebot.db.enc 2>/dev/null; then
              git show origin/bot-state:pokebot.db.enc > /tmp/pokebot.db.enc
            else
              git show origin/bot-state:pokebot.db > /tmp/pokebot.db.enc  # stato di prima della cifratura
            fi
            python cli.py unseal /tmp/pokebot.db.enc data/pokebot.db
            git show origin/bot-state:code-sha > /tmp/code-sha-before 2>/dev/null || true  # con quale versione è stato scritto
            echo "stato ripristinato"
          fi
          python cli.py db-hash > /tmp/db-hash-before

      # Due fasi, con un salvataggio in mezzo: lo stato esce subito dopo i comandi, prima della ricerca (che può durare
      # un paio di minuti), così la Mini App vede le modifiche in mezzo minuto. I comandi eseguiti escono dalla coda
      # solo dopo il salvataggio: se il giro si interrompe, il prossimo li ritrova (scripts/save_state.sh).
      - name: Comandi Telegram
        run: python cli.py actions --fase comandi

      - name: Salva lo stato (dopo i comandi)
        if: always() && steps.restore.outcome == 'success'
        run: bash scripts/save_state.sh

      - name: Inseguimenti + ricerca
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python cli.py actions --fase ricerca $FORCE

      - name: Salva lo stato
        if: always() && steps.restore.outcome == 'success'
        run: bash scripts/save_state.sh
