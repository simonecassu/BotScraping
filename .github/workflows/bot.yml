# Il bot gira gratis su GitHub Actions, senza PC.
# - Lo sveglia il ponte Cloudflare (deploy/cloudflare-worker.js): subito a ogni messaggio Telegram e, ogni 5 minuti,
#   solo quando c'è qualcosa da fare (inseguimenti, ricerca completa ogni /intervallo minuti, post del canale).
#   Il cron qui sotto è solo una riserva oraria; "Run workflow" forza una ricerca immediata.
# - Lo stato (database e dati per la Mini App) è salvato cifrato nel branch "bot-state" (il repository è pubblico):
#   la chiave è ricavata da TELEGRAM_BOT_TOKEN, quindi cambiando token lo stato salvato non si legge più (vedi README).
name: PokéBot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [telegram, timer]

permissions:
  contents: write

concurrency:
  group: pokebot
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      # Se il ripristino fallisce il job si ferma e lo stato salvato resta intatto (mai sovrascritto con uno vuoto).
      - name: Ripristina lo stato precedente
        id: restore
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p data
          rc=0; git ls-remote --exit-code --heads origin bot-state >/dev/null || rc=$?
          if [ "$rc" = 2 ]; then
            echo "primo avvio: nessuno stato precedente"
          elif [ "$rc" != 0 ]; then
            echo "::error::GitHub non risponde: riprovo al prossimo giro"; exit 1
          else
            git fetch --depth=1 origin bot-state
            if git cat-file -e origin/bot-state:pokebot.db.enc 2>/dev/null; then
              git show origin/bot-state:pokebot.db.enc > /tmp/pokebot.db.enc
            else
              git show origin/bot-state:pokebot.db > /tmp/pokebot.db.enc  # stato di prima della cifratura
            fi
            python cli.py unseal /tmp/pokebot.db.enc data/pokebot.db
            echo "stato ripristinato"
          fi
          python cli.py db-hash > /tmp/db-hash-before

      - name: Comandi Telegram + ricerca
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # per leggere e svuotare la coda comandi (branch bot-queue)
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python cli.py actions $FORCE

      # I comandi eseguiti escono dalla coda solo dopo il salvataggio: se il giro si interrompe, il prossimo li ritrova.
      - name: Salva lo stato
        if: always() && steps.restore.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f data/pokebot.db || exit 0
          if [ "$(python cli.py db-hash)" = "$(cat /tmp/db-hash-before)" ]; then
            echo "nulla è cambiato: stato non risalvato"; python cli.py queue-ack; exit 0
          fi
          rm -rf /tmp/state && mkdir -p /tmp/state
          python cli.py export-json /tmp/state || echo "::warning::stato per la Mini App non scritto"
          # dopo l'export, così eventuali album creati dall'export restano nel database
          python cli.py seal data/pokebot.db /tmp/state/pokebot.db.enc
          cd /tmp/state
          git init -q -b bot-state
          git -c user.name=pokebot -c user.email=pokebot@users.noreply.github.com add .
          git -c user.name=pokebot -c user.email=pokebot@users.noreply.github.com commit -q -m "stato"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state
          cd "$GITHUB_WORKSPACE" && python cli.py queue-ack
