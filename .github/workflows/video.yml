name: Video demo Mini App

# Registra un giro nella Mini App con dati dimostrativi (immagini vere delle carte) e lo manda su Telegram.
on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Chat Telegram a cui mandare il video (vuoto = al secret TELEGRAM_CHAT_ID, se c'è)"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Pescacarte dimostrativo
        run: python scripts/demo_state.py /tmp/demo
      - name: Registra
        run: NODE_PATH=/tmp/pw/node_modules timeout 420 node scripts/record_demo.cjs /tmp/demo /tmp/video
      - name: Converte in MP4 verticale
        run: |
          ffmpeg -v error -y -i /tmp/video/pokebot-demo.webm -vf "scale=1080:-2,fps=30" -c:v libx264 -preset slow -crf 20 \
            -pix_fmt yuv420p -movflags +faststart -an /tmp/video/pokebot-demo.mp4
          ls -la /tmp/video
      - uses: actions/upload-artifact@v4
        with:
          name: pokebot-demo
          path: /tmp/video/pokebot-demo.mp4
      - name: Salva il video sul ramo "video"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/vb && cd /tmp/vb && git init -q -b video
          cp /tmp/video/pokebot-demo.mp4 .
          git -c user.name=pokebot -c user.email=pokebot@users.noreply.github.com add .
          git -c user.name=pokebot -c user.email=pokebot@users.noreply.github.com commit -qm "Video demo"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" video
      - name: Manda su Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$CHAT" ] || { echo "nessuna chat: il video resta tra gli artefatti"; exit 0; }
          curl -sS -o /tmp/tg.json -F chat_id="$CHAT" -F supports_streaming=true \
            -F caption="🎬 Video demo della Mini App (dati dimostrativi)" \
            -F video=@/tmp/video/pokebot-demo.mp4 "https://api.telegram.org/bot$TOKEN/sendVideo"
          grep -q '"ok":true' /tmp/tg.json || { cat /tmp/tg.json; exit 1; }
