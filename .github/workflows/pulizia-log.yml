# Cancella i log dei giri vecchi (prima della cifratura mostravano i chat id completi). Si avvia a mano.
name: Pulizia vecchi log

on:
  workflow_dispatch:
    inputs:
      prima_di:
        description: "Cancella i log dei giri partiti prima di questo momento (UTC)"
        default: "2026-10-09T11:51:00Z"
        required: true

permissions:
  actions: write

jobs:
  pulisci:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Cancella i log
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMA_DI: ${{ inputs.prima_di }}
        shell: python
        run: |
          import json, os, time, urllib.error, urllib.request

          API = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs"
          HEADERS = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          cutoff = os.environ["PRIMA_DI"]

          def call(method, url):
              """Una richiesta; se il limite orario di GitHub è finito, aspetta che riparta."""
              while True:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, method=method, headers=HEADERS)) as r:
                          left, reset = int(r.headers.get("X-RateLimit-Remaining", 100)), int(r.headers.get("X-RateLimit-Reset", 0))
                          body = r.read()
                          if left < 5:
                              wait = max(0, reset - time.time()) + 5
                              print(f"limite orario raggiunto: aspetto {wait / 60:.0f} min", flush=True)
                              time.sleep(wait)
                          return r.status, (json.loads(body) if body else None)
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429) and e.headers.get("X-RateLimit-Remaining") == "0":
                          wait = max(0, int(e.headers.get("X-RateLimit-Reset", 0)) - time.time()) + 5
                          print(f"limite orario raggiunto: aspetto {wait / 60:.0f} min", flush=True)
                          time.sleep(wait)
                          continue
                      return e.code, None

          ids, page = [], 1
          while True:
              _, data = call("GET", f"{API}?per_page=100&page={page}")
              runs = (data or {}).get("workflow_runs") or []
              if not runs:
                  break
              ids += [r["id"] for r in runs if r["created_at"] < cutoff and r["id"] not in ids]
              page += 1
          print(f"giri da ripulire: {len(ids)}", flush=True)
          done = gone = other = 0
          for i, run_id in enumerate(ids, 1):
              status, _ = call("DELETE", f"{API}/{run_id}/logs")
              if status == 204:
                  done += 1
              elif status in (404, 410):
                  gone += 1  # log già scaduti o già cancellati
              else:
                  other += 1
              if i % 100 == 0:
                  print(f"{i}/{len(ids)}", flush=True)
          print(f"log cancellati: {done} · già assenti: {gone} · non cancellati: {other}")
          if other:
              raise SystemExit(1)
