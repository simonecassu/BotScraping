# Pubblica il ponte Telegram → GitHub su Cloudflare Workers e lo attiva, senza toccare l'editor di Cloudflare.
# Secret necessari (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token Cloudflare creato con il modello "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  Account ID (pagina Workers & Pages, colonna di destra)
#   BRIDGE_GITHUB_TOKEN    fine-grained token GitHub con "Contents: Read and write" su questo repository
#   TELEGRAM_BOT_TOKEN     già presente per il bot
#   TELEGRAM_CHAT_ID       (facoltativo) il tuo chat id: il ponte ti riconosce anche prima che il bot salvi lo stato
name: Ponte Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controlla i secret
        env:
          BRIDGE_GITHUB_TOKEN: ${{ secrets.BRIDGE_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          manca=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BRIDGE_GITHUB_TOKEN TELEGRAM_BOT_TOKEN; do
            [ -n "${!n}" ] || manca="$manca $n"
          done
          if [ -n "$manca" ]; then echo "::error::Secret mancanti:$manca"; exit 1; fi

      - name: Pubblica il worker
        run: |
          set -o pipefail  # se il deploy fallisce, il passo fallisce (e le chiavi non vanno al worker vecchio)
          npx --yes wrangler@4.137.0 deploy 2>&1 | tee deploy.log

      - name: Imposta le chiavi del worker
        env:
          BRIDGE_GITHUB_TOKEN: ${{ secrets.BRIDGE_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4.137.0 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$BRIDGE_GITHUB_TOKEN" | npx --yes wrangler@4.137.0 secret put GITHUB_TOKEN
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@4.137.0 secret put TELEGRAM_CHAT_ID
          fi

      - name: Attiva il ponte su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # /setup risponde solo con la chiave ricavata dal token (come nel worker): nessun altro può spostare il webhook
          token=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')  # come il worker e config.py
          key=$(printf 'pokebot-admin:%s' "$token" | sha256sum | cut -c1-40)
          echo "::add-mask::$key"
          url=$(grep -o 'https://[A-Za-z0-9.-]*workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Indirizzo del worker non trovato nel log"; exit 1; fi
          echo "Indirizzo del ponte: $url"
          # le chiavi appena caricate impiegano qualche secondo a propagarsi: riprova fino a 2 minuti
          for i in $(seq 1 12); do
            sleep 10
            out=$(curl -sS -H "X-Pokebot-Key: $key" "$url/setup" || true)
            if echo "$out" | grep -q "Ponte attivo"; then
              echo "$out" | sed 's/<[^>]*>//g' | grep -v '^\s*$'
              echo "::notice::Ponte attivo su $url — ogni messaggio al bot avvia subito la ricerca"
              exit 0
            fi
            echo "tentativo $i: non ancora pronto"
          done
          echo "$out" | sed 's/<[^>]*>//g' | grep -v '^\s*$'
          echo "::error::Attivazione fallita, vedi sopra"
          exit 1
